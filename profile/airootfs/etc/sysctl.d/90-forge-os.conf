# forge-os gaming/desktop tuning, the kind Nobara, Bazzite and CachyOS ship.

# Split-lock detection (kernel default since 5.19) throttles a task that
# does split-locked memory access by sleeping it, which some games and
# their anti-cheat/DRM do constantly: big FPS drops. Warn, don't throttle.
kernel.split_lock_mitigate = 0

# Swap is zram (compressed RAM; see /etc/systemd/zram-generator.conf), so
# swapping is cheap and should happen before page cache is dropped.
# Values from ArchWiki's "Zram - Optimizing swap on zram".
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
