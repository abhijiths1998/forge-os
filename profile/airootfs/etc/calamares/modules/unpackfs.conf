---
# Copy from the squashfs the live system is already running on, not from
# the .sfs file on the ISO. mkinitcpio-archiso's hook always mounts the
# image read-only at /run/archiso/airootfs (the overlay's lower layer), but
# the file's own path moves: with copytoram (the default whenever RAM
# allows, and forced by the PXE hooks) it's copied under
# /run/archiso/copytoram and /run/archiso/bootmnt is unmounted, which once
# failed an install with "Bad unpackfs configuration". The boot entries also
# pass copytoram=n, but that's to save RAM; this no longer depends on it.
unpack:
    - source: "/run/archiso/airootfs/"
      sourcefs: "file"
      destination: ""
