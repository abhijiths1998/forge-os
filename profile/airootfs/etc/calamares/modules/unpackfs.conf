---
# Path derived from profiledef.sh (install_dir="forge") and the archiso
# live-boot layout: mkinitcpio-archiso's hook mounts the ISO at
# /run/archiso/bootmnt and looks for <install_dir>/<arch>/airootfs.sfs.
unpack:
    - source: "/run/archiso/bootmnt/forge/x86_64/airootfs.sfs"
      sourcefs: "squashfs"
      destination: ""
