---
# Pinned explicitly rather than inheriting Calamares' built-in defaults, so
# the boot layout is visible in this repo. The EFI system partition is
# mounted at /boot (see partition.conf), so GRUB, grub.cfg, the kernels and
# the initramfs images all live on one FAT32 filesystem.
efiBootLoader: "grub"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Also install GRUB to the removable fallback path (EFI/BOOT/BOOTX64.EFI)
# for firmware that forgets or ignores NVRAM boot entries. This path is
# where a stale GRUB, still pointing at the old btrfs /boot, dropped a
# machine into grub rescue; that can't happen now that both copies are
# written by the same install against the same /boot.
installEFIFallback: true
installHybridGRUB: false
