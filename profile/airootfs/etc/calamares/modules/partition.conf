# The ESP is mounted at /boot so kernels and initramfs live on FAT32.
# This started as a workaround for GRUB failing to read vmlinuz-linux-zen
# off the btrfs root ("premature end of file"). The real cause was a
# trailing sparse hole left by unpackfs' `rsync -S`, now fixed in
# forge-postinstall.sh, which BIOS installs (no ESP, /boot on btrfs) rely
# on. Two kernels' initramfs images plus GRUB need far more than the old
# 300MiB, hence 1GiB.
efi:
    mountPoint:         "/boot"
    recommendedSize:    1024MiB
    minimumSize:        512MiB
    label:              "EFI"
userSwapChoices:
    - none
    - small
    - suspend
    - file
luksGeneration: luks1
drawNestedPartitions:   false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
initialSwapChoice: none
# btrfs by default: mount.conf's subvolume layout is what gives us the
# Garuda-style snapper/grub-btrfs rollback safety net.
defaultFileSystemType:  "btrfs"
essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
    enable: true
