---
backend: pacman
skip_if_no_internet: false
update_db: false
ignore_update_db_error: true
update_system: false
pacman:
    num_retries: 3
    disable_download_timeout: false
    needed_only: false
operations:
  - remove:
    # Live-medium-only: unpackfs copies the whole live squashfs onto the
    # target verbatim, so these need to be explicitly removed afterwards
    # rather than never installed in the first place.
    - calamares
    - calamares-debug
    - memtest86+
    - memtest86+-efi
    - edk2-shell
