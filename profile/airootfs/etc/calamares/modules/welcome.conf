---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false
requirements:
    # KDE + full gaming stack is a meaningfully bigger install than a
    # minimal Arch base.
    requiredStorage:    20.0
    requiredRam:        2.0
    internetCheckUrl:   https://archlinux.org
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    required:
        - ram
geoip:
    style:    "none"
