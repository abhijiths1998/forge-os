# The Forge session's compositor settings (forge-session starts Hyprland
# with this file). Users don't edit this: the theme's corners and blur come
# from ~/.config/forge/hypr/theme.conf (forge-theme-sync), and anything of
# their own goes in ~/.config/forge/hypr/user.conf, read last.

# --- Screens --------------------------------------------------------------
monitor = , preferred, auto, auto

# --- Cursor: Breeze, as under Plasma --------------------------------------------
env = XCURSOR_THEME,breeze_cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
exec-once = hyprctl setcursor breeze_cursors 24

# --- Title bars ----------------------------------------------------------------
# hyprbars (Hyprland's own title-bar plugin, built for this Hyprland version
# by the forge-hyprbars package). forge-session sets FORGE_BARS when it's
# installed, so the desktop still starts without it.
# hyprlang if FORGE_BARS
plugin = /usr/lib/forge/hyprbars.so
plugin {
    hyprbars {
        bar_height = 34
        bar_padding = 12
        bar_button_padding = 8
        bar_blur = true
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_title_enabled = true
        bar_text_font = Plus Jakarta Sans
        bar_text_size = 11
        bar_text_weight = semibold
        bar_text_align = center
        bar_buttons_alignment = right
        icon_on_hover = false
        # The colours follow the theme (theme.conf); these are Forge Glass dark.
        bar_color = rgba(1a1c33b0)
        col.text = rgb(e4e6f4)
        inactive_button_color = rgba(e4e6f430)
        on_double_click = hyprctl dispatch fullscreen 1
        # Right to left: close, maximise, minimise (as Plasma's).
        hyprbars-button = rgb(f28b9b), 16, ×, hyprctl dispatch killactive, rgb(3a1520)
        hyprbars-button = rgb(8fd3a8), 16, +, hyprctl dispatch fullscreen 1, rgb(123622)
        hyprbars-button = rgb(f6cfa8), 16, −, hyprctl dispatch movetoworkspacesilent special:minimized, rgb(4a2f12)
    }
}
# Apps that draw their own title bar, and Forge's own floating parts.
windowrule = hyprbars:no_bar on, match:class ^(brave-browser|chromium|google-chrome|steam|org\.forgeos\.launcher)$
# hyprlang endif

# --- Start the desktop ------------------------------------------------------
# The session's environment for D-Bus-started services (forged, portals) and
# systemd's XDG autostart (KDE Connect, the wallet, Forge Control...).
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start xdg-desktop-autostart.target
exec-once = forge-keep forge-shell wallpaper
exec-once = forge-keep forge-shell bar
exec-once = forge-keep forge-shell dock
# Its autostart entry says OnlyShowIn=KDE.
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# --- Look: Forge Glass -----------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 0
    layout = dwindle
    resize_on_border = true
    allow_tearing = true  # games that ask for it, for the lowest latency
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false
    shadow {
        enabled = true
        range = 22
        render_power = 3
        offset = 0 6
        color = rgba(0a0c1a40)
        color_inactive = rgba(0a0c1a20)
    }
    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.015
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.4
        new_optimizations = true
        popups = true
    }
}

animations {
    enabled = true
    bezier = glide, 0.22, 1, 0.36, 1
    bezier = settle, 0.34, 1.3, 0.64, 1
    animation = windows, 1, 4, settle, popin 88%
    animation = windowsOut, 1, 3, glide, popin 92%
    animation = fade, 1, 3, glide
    animation = layers, 1, 3, glide, fade
    animation = workspaces, 1, 4, glide, slide
}

ecosystem {
    no_donation_nag = true
    no_update_news = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(1b1f33)
    focus_on_activate = true
    vrr = 2  # variable refresh rate in fullscreen games
}

dwindle {
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

gesture = 3, horizontal, workspace

# --- Forge Shell's surfaces: frosted where they're drawn, not around them ---
layerrule = blur on, match:namespace ^(forge-bar|forge-dock|forge-control)$
layerrule = ignore_alpha 0.05, match:namespace ^(forge-bar|forge-dock|forge-control)$

# Every window floats: moved by its title bar (or Super+drag), resized from
# its edges, minimised and maximised from its buttons. No tiling.
windowrule = float on, match:class .*
# New windows open in the middle, clear of the top bar (left to Hyprland, a
# window's title bar ended up under it).
windowrule = center on, match:class .*
# Konsole asks for a tiny first window outside Plasma.
windowrule = size 960 600, match:class ^(org\.kde\.konsole)$

# Forge Launcher: a floating card in the middle of the screen, frosted. It
# closes when it loses focus, so focus stays on it under the mouse moving.
windowrule = center on, match:class ^(org\.forgeos\.launcher)$
windowrule = pin on, match:class ^(org\.forgeos\.launcher)$
windowrule = stay_focused on, match:class ^(org\.forgeos\.launcher)$
windowrule = no_shadow on, match:class ^(org\.forgeos\.launcher)$

# --- Keys ---------------------------------------------------------------------
$mod = SUPER

bind = $mod, SPACE, exec, forge-launcher
bind = ALT, SPACE, exec, forge-launcher
bind = $mod, A, exec, forge-control
bind = $mod, RETURN, exec, konsole
bind = $mod, T, exec, konsole
bind = $mod, E, exec, dolphin
bind = $mod, Q, killactive
bind = ALT, F4, killactive
bind = $mod, F, fullscreen, 0
bind = $mod, UP, fullscreen, 1     # maximise, keeping the top bar and dock
bind = $mod, DOWN, movetoworkspacesilent, special:minimized
bind = $mod, M, movetoworkspacesilent, special:minimized
bind = $mod, L, exec, loginctl lock-session
bind = $mod SHIFT, E, exit

# Windows and workspaces
bind = ALT, TAB, cyclenext
bind = ALT, TAB, bringactivetotop
bind = $mod, TAB, workspace, e+1
bind = $mod SHIFT, TAB, workspace, e-1
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots: grim and slurp until Forge Shot captures through Hyprland.
bind = , PRINT, exec, grim - | wl-copy && notify-send -a Forge "Screenshot copied"
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Sound, brightness and media keys (held keys repeat; locked: work on the
# lock screen too)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# --- The user's theme and own settings, last so they win ---------------------
source = ~/.config/forge/hypr/theme.conf
source = ~/.config/forge/hypr/user.conf
