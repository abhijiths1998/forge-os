# Forge OS: which portal answers what in a Hyprland session.
# Hyprland's: screen sharing, screenshots, global shortcuts.
# GTK's: file pickers, the appearance settings apps read (dark/light, accent).
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
