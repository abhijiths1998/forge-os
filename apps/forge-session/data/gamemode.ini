; Forge OS: GameMode's settings. While a game runs under GameMode (Steam,
; Lutris and Heroic start it), the screen stays awake and unlocked.
; Copy this to ~/.config/gamemode.ini for your own settings.
[general]
renice=10
softrealtime=auto
inhibit_screensaver=1

[custom]
start=forge-game gamemode-start
end=forge-game gamemode-end
