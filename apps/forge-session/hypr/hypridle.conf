# Forge OS: when the screen dims, locks, sleeps. hypridle reads this through
# forge-idle; copy it to ~/.config/hypr/hypridle.conf to change it.
#
# Anything holding an idle inhibitor stops all of this: video players, a
# full-screen game (Hyprland's idle_inhibit rule) and any game under
# GameMode (forge-game-inhibit.service).
general {
    lock_cmd = forge-lock
    unlock_cmd = pkill -USR1 hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 4 minutes: dim to 30% (back as it was on any input).
listener {
    timeout = 240
    on-timeout = brightnessctl --save set 30%
    on-resume = brightnessctl --restore
}

# 5 minutes: lock.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 minutes: screens off.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 minutes: sleep.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
