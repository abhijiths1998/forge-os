# Forge Glass lock screen. hyprlock reads this through forge-lock; copy it
# to ~/.config/hypr/hyprlock.conf to change it.

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

auth {
    fingerprint:enabled = true
}

# The desktop itself, frosted.
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    vibrancy = 0.25
    noise = 0.01
    brightness = 0.7
    contrast = 0.95
}

# A big, thin clock.
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgba(f4f5fbee)
    font_size = 108
    font_family = Plus Jakarta Sans ExtraLight
    position = 0, 230
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    color = rgba(f4f5fbbb)
    font_size = 20
    font_family = Plus Jakarta Sans
    position = 0, 125
    halign = center
    valign = center
}

# The glass card the password goes in.
shape {
    monitor =
    size = 380, 150
    color = rgba(f4f5fb1f)
    rounding = 28
    border_size = 1
    border_color = rgba(ffffff40)
    position = 0, -95
    halign = center
    valign = center
}

label {
    monitor =
    text = $DESC
    color = rgba(f4f5fbdd)
    font_size = 15
    font_family = Plus Jakarta Sans SemiBold
    position = 0, -55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 0
    rounding = 18
    inner_color = rgba(1b1d2b66)
    font_color = rgba(f4f5fbff)
    font_family = Plus Jakarta Sans
    check_color = rgba(7f8ef5ff)
    fail_color = rgba(f07f8eff)
    capslock_color = rgba(f5c97fff)
    placeholder_text = <span foreground="##f4f5fb99">Password</span>
    fail_text = <i>$FAIL</i>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    position = 0, -115
    halign = center
    valign = center
}

label {
    monitor =
    text = Locked · Forge OS
    color = rgba(f4f5fb88)
    font_size = 12
    font_family = Plus Jakarta Sans
    position = 0, 40
    halign = center
    valign = bottom
}
