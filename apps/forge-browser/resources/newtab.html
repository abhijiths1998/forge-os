<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  /* Forge Glass, from branding-source/glass/colors.py. */
  :root {
    --text: #1E2140; --dim: #6E7391; --accent: #6C7CF0;
    --glass: rgba(251, 251, 254, 0.55); --rim: rgba(255, 255, 255, 0.6);
    --shade: rgba(243, 242, 250, 0.25);
    color-scheme: light;
  }
  :root.dark {
    --text: #E4E6F4; --dim: #9296B5; --accent: #7F8EF5;
    --glass: rgba(26, 28, 51, 0.5); --rim: rgba(255, 255, 255, 0.14);
    --shade: rgba(18, 20, 42, 0.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    color: var(--text);
    background: #232640 url("forge://wallpaper/{{VARIANT}}") center / cover no-repeat fixed;
    display: flex; align-items: center; justify-content: center;
  }
  body::before {
    content: ""; position: fixed; inset: 0; background: var(--shade);
  }
  main { position: relative; width: min(760px, 92vw); text-align: center; }
  .clock { font-size: 88px; font-weight: 300; letter-spacing: -2px; line-height: 1; }
  .date { color: var(--dim); font-size: 17px; margin: 10px 0 34px; font-weight: 500; }
  form {
    display: flex; align-items: center; gap: 12px;
    background: var(--glass); border: 1px solid var(--rim);
    border-radius: 18px; padding: 0 20px; height: 58px;
    backdrop-filter: blur(24px) saturate(1.6);
    box-shadow: 0 18px 50px rgba(10, 12, 30, 0.25);
  }
  form svg { flex: none; opacity: 0.6; }
  input {
    flex: 1; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 18px; color: var(--text);
  }
  input::placeholder { color: var(--dim); }
  .tiles {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px; margin-top: 30px;
  }
  .tiles a {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 18px 10px; border-radius: 16px; text-decoration: none; color: var(--text);
    background: var(--glass); border: 1px solid var(--rim);
    backdrop-filter: blur(24px) saturate(1.6);
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .tiles a:hover { transform: translateY(-2px); border-color: var(--accent); }
  .tiles b {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    background: var(--accent); color: #fff; font-size: 17px; font-weight: 700;
  }
  .tiles span {
    font-size: 13px; font-weight: 600; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .shield { margin-top: 26px; color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="clock" id="clock"></div>
  <div class="date" id="date"></div>
  <form action="https://duckduckgo.com/" method="get">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input name="q" placeholder="Search the web or type a URL" autofocus autocomplete="off">
  </form>
  <div class="tiles">{{TILES}}</div>
  <div class="shield">{{SHIELD}}</div>
</main>
<script>
  if ("{{VARIANT}}" === "dark") document.documentElement.classList.add("dark");
  const tick = () => {
    const now = new Date();
    document.getElementById("clock").textContent =
      now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    document.getElementById("date").textContent =
      now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  };
  tick(); setInterval(tick, 5000);
  // A URL typed here opens directly instead of being searched.
  document.querySelector("form").addEventListener("submit", (e) => {
    const q = e.target.q.value.trim();
    if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(q) || /^https?:\/\//.test(q)) {
      e.preventDefault();
      location.href = q.includes("://") ? q : "https://" + q;
    }
  });
</script>
</body>
</html>
